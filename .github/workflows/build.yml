name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble Android project from root files
        run: |
          mkdir -p app/src/main/java/com/fu/voice
          cp MainActivity.java VoiceService.java app/src/main/java/com/fu/voice/
          cp AndroidManifest.xml app/src/main/

          cat > settings.gradle <<'EOG'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositories { google(); mavenCentral() }
          }
          rootProject.name = 'voice'
          include ':app'
          EOG

          cat > build.gradle <<'EOG'
          plugins {
            id 'com.android.application' version '8.5.2' apply false
          }
          EOG

          cat > app/build.gradle <<'EOG'
          plugins {
            id 'com.android.application'
          }
          android {
            namespace 'com.fu.voice'
            compileSdk 34
            defaultConfig {
              applicationId 'com.fu.voice'
              minSdk 26
              targetSdk 34
              versionCode 3
              versionName '3.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies {
            implementation 'com.squareup.okhttp3:okhttp:4.12.0'
            implementation 'com.squareup.okio:okio:3.6.0'
          }
          EOG

          echo "org.gradle.jvmargs=-Xmx2g" > gradle.properties

      - name: Build
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: voice-apk
          path: app/build/outputs/apk/debug/app-debug.apk
